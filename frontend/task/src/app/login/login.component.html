<div class="min-h-screen flex items-center justify-center relative p-4">
  <div class="glass-card p-10 w-full max-w-md relative z-10 animate-fade-in-up">
    
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-primary-500 to-accent-500 mb-4 shadow-lg shadow-primary-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-white tracking-tight">TaskFlow</h1>
      <p class="text-gray-400 mt-2 font-light">Welcome back, please login to your account.</p>
    </div>

    <form (submit)="onLogin($event)">
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input
              type="email"
              placeholder="you@example.com"
              class="glass-input pl-11"
              required
            />
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2 pl-1">
            <label class="block text-sm font-medium text-gray-300">Password</label>
            <a href="#" class="text-sm text-primary-500 hover:text-primary-400 transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input
              type="password"
              placeholder="••••••••"
              class="glass-input pl-11"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-primary w-full mt-8 flex justify-center items-center">
          <span>Sign In</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </form>
    
    <div class="mt-8 text-center text-sm text-gray-400">
      Don't have an account? <a href="#" class="text-primary-500 hover:text-primary-400 font-medium transition-colors">Sign up</a>
    </div>
  </div>
</div>
