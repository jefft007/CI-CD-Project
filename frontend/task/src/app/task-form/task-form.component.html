<div class="min-h-screen flex items-center justify-center relative p-4 z-10">
  <div class="glass-card p-8 md:p-10 w-full max-w-lg relative animate-fade-in-up">
    
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Add New Task</h1>
        <p class="text-gray-400 mt-1 text-sm">Create a new task for your dashboard</p>
      </div>
      <button routerLink="/dashboard" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <form (submit)="saveTask($event)">
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Task Title</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
              </svg>
            </div>
            <input
              type="text"
              placeholder="E.g., Complete Jenkins Pipeline"
              class="glass-input pl-11"
              required
            />
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Description (Optional)</label>
          <textarea
            placeholder="Add details about this task..."
            class="glass-input min-h-[100px] resize-y"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Status</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
              </svg>
            </div>
            <select class="glass-input pl-11 appearance-none bg-dark-800 text-gray-200" required>
              <option value="Pending" class="bg-dark-800 text-gray-200">Pending</option>
              <option value="In Progress" class="bg-dark-800 text-gray-200">In Progress</option>
              <option value="Completed" class="bg-dark-800 text-gray-200">Completed</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </div>
          </div>
        </div>

        <div class="pt-4 flex gap-4">
          <button type="button" routerLink="/dashboard" class="btn-secondary flex-1">
            Cancel
          </button>
          <button type="submit" class="btn-primary flex-1 flex justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            Save Task
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
