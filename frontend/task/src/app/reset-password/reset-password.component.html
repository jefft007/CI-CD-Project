<div class="min-h-screen flex items-center justify-center relative p-4">
  <div class="glass-card p-10 w-full max-w-md relative z-10 animate-fade-in-up">
    
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-white tracking-tight">Set New Password</h1>
      <p class="text-gray-400 mt-2 font-light">Enter your new password below.</p>
    </div>

    <form (submit)="onSubmit($event)">
      <div class="space-y-6">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg text-sm">
          {{ errorMessage }}
        </div>
        <div *ngIf="message" class="bg-green-500/10 border border-green-500/50 text-green-500 px-4 py-3 rounded-lg text-sm">
          {{ message }} <br> Redirecting to login...
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">New Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              class="glass-input pl-11"
              required
              [disabled]="!!message"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Confirm New Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input
              type="password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="••••••••"
              class="glass-input pl-11"
              required
              [disabled]="!!message"
            />
          </div>
        </div>

        <button type="submit" [disabled]="isLoading || !token || !!message" class="btn-primary w-full mt-8 flex justify-center items-center">
          <span>{{ isLoading ? 'Resetting...' : 'Reset Password' }}</span>
        </button>
      </div>
    </form>
    
  </div>
</div>
