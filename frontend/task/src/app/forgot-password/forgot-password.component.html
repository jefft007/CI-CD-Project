<div class="min-h-screen flex items-center justify-center relative p-4">
  <div class="glass-card p-10 w-full max-w-md relative z-10 animate-fade-in-up">
    
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-white tracking-tight">Forgot Password</h1>
      <p class="text-gray-400 mt-2 font-light">Enter your email and we'll send you a reset link.</p>
    </div>

    <form (submit)="onSubmit($event)">
      <div class="space-y-6">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded-lg text-sm">
          {{ errorMessage }}
        </div>
        <div *ngIf="message" class="bg-green-500/10 border border-green-500/50 text-green-500 px-4 py-3 rounded-lg text-sm">
          {{ message }}
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2 pl-1">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="you@example.com"
              class="glass-input pl-11"
              required
            />
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="btn-primary w-full mt-8 flex justify-center items-center">
          <span>{{ isLoading ? 'Sending...' : 'Send Reset Link' }}</span>
        </button>
      </div>
    </form>
    
    <div class="mt-8 text-center text-sm text-gray-400">
      Remember your password? <a routerLink="/login" class="text-primary-500 hover:text-primary-400 font-medium transition-colors">Sign in</a>
    </div>
  </div>
</div>
